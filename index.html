
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dropbox Cloud Storage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3fa;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        .container {
            background: white;
            padding: 30px;
            max-width: 650px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ddd;
        }

        h1 {
            color: #0061ff;
        }

        h2 {
            color: #333;
        }

        p {
            color: #666;
        }

        hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 25px 0;
        }

        input {
            margin: 20px 0;
            max-width: 100%;
        }

        button {
            background: #0061ff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #0047bb;
        }

        .file {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            background: #f1f5f9;
            padding: 14px;
            margin: 10px 0;
            border-radius: 6px;
            text-align: left;
        }

        .filename {
            overflow-wrap: anywhere;
        }

        a {
            color: #0061ff;
            text-decoration: none;
            font-weight: bold;
            white-space: nowrap;
        }

        a:hover {
            text-decoration: underline;
        }

        .note {
            font-size: 13px;
            color: #777;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Dropbox Cloud Storage</h1>

        <p>Third-Party Cloud Storage Integration using Flask</p>

        <hr>

        <h2>Upload File</h2>

        <p>Select a PDF or TXT file to upload to Dropbox.</p>

        <form action="/upload"
              method="POST"
              enctype="multipart/form-data">

            <input
                type="file"
                name="file"
                accept=".pdf,.txt"
                required
            >

            <br>

            <button type="submit">
                Upload to Dropbox
            </button>

        </form>

        <p class="note">Supported formats: PDF and TXT</p>

        <hr>

        <h2>Files Available in Dropbox</h2>

        {% for file in files %}

        <div class="file">

            <span class="filename">
                📄 {{ file }}
            </span>

            <a href="{{ url_for('download', filename=file) }}">
                Download ↓
            </a>

        </div>

        {% else %}

        <p>No files uploaded yet.</p>

        {% endfor %}

    </div>

</body>
</html>
